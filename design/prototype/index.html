<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coursework 原型</title>
<!--
  Static UI prototype for `coursework ui` (decisions #21, #24, #25).
  Single home page: month-first calendar with teaching weeks, a module rail,
  a task drawer, and an avatar menu holding status, metrics, and settings.
  All data is synthetic. No network access, no dependencies.
-->
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --text: #0a0a0a; --muted: #6b6b6b; --faint: #a3a3a3;
    --line: #e7e7e7; --hover: #f2f2f2; --ink: #0a0a0a; --on-ink: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --radius: 12px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0b; --panel: #141414; --text: #f2f2f2; --muted: #9a9a9a; --faint: #5c5c5c;
      --line: #262626; --hover: #1c1c1c; --ink: #f2f2f2; --on-ink: #0b0b0b;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0b; --panel: #141414; --text: #f2f2f2; --muted: #9a9a9a; --faint: #5c5c5c;
    --line: #262626; --hover: #1c1c1c; --ink: #f2f2f2; --on-ink: #0b0b0b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; transition: background .3s var(--ease), color .3s var(--ease); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Header ---------- */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; background: var(--ink); border-radius: 3px; transform: rotate(45deg); }
  .nav-month { display: flex; align-items: center; gap: 4px; margin-left: 12px; }
  .nav-month h1 { font-size: 16px; margin: 0 8px; min-width: 112px; text-align: center; font-weight: 600; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); transition: background .2s, transform .15s var(--ease); }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn:active { transform: scale(.94); }
  .seg { position: relative; display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; padding: 4px 14px; border-radius: 7px; color: var(--muted); transition: color .25s; }
  .seg button[aria-pressed="true"] { color: var(--on-ink); }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 7px; background: var(--ink);
    transition: transform .35s var(--ease), width .35s var(--ease); }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 14px; transition: background .2s, transform .15s var(--ease); }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: scale(.97); }
  .btn.ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .btn.ink:hover { opacity: .88; }

  /* ---------- Avatar menu ---------- */
  .avatar-wrap { position: relative; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--ink); color: var(--on-ink);
    display: grid; place-items: center; font-weight: 700; overflow: hidden; padding: 0; transition: transform .2s var(--ease), box-shadow .2s; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar:hover { transform: scale(1.06); box-shadow: 0 0 0 3px var(--hover); }
  .badge-dot { position: absolute; right: -1px; top: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--bg); pointer-events: none; }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); width: 240px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; transform-origin: top right;
    opacity: 0; transform: translateY(-4px) scale(.96); pointer-events: none; transition: opacity .18s var(--ease), transform .22s var(--ease); }
  .avatar-wrap:hover .menu, .avatar-wrap:focus-within .menu, .menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu::before { content: ""; position: absolute; top: -10px; left: 0; right: 0; height: 10px; } /* hover bridge */
  .menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .menu .who b { display: block; }
  .menu .who span { color: var(--muted); font-size: 12px; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; text-align: left; }
  .menu button:hover { background: var(--hover); }
  .menu .hint { margin-left: auto; font-size: 11px; color: var(--muted); }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding: 20px 24px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .view { animation: viewIn .45s var(--ease); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Month ---------- */
  .month { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); }
  .month .dow { padding: 10px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  .wk { padding: 10px 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .wk b { display: block; color: var(--text); font-size: 13px; }
  .wk.break b { color: var(--muted); font-weight: 500; }
  .cell { min-height: 112px; padding: 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); position: relative; min-width: 0;
    animation: cellIn .5s var(--ease) both; animation-delay: calc(var(--i) * 12ms); transition: background .2s; }
  .cell:nth-child(8n) { border-right: 0; }
  .cell:hover { background: var(--hover); }
  @keyframes cellIn { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
  .cell.out .num { color: var(--faint); }
  .num { font-size: 12px; font-variant-numeric: tabular-nums; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; margin-bottom: 4px; }
  .cell.today .num { background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .ev { display: flex; align-items: center; gap: 5px; width: 100%; font-size: 11.5px; line-height: 1.3; padding: 3px 6px; margin-bottom: 3px;
    border-radius: 6px; border: 1px solid transparent; background: none; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: transform .15s var(--ease), background .2s; }
  .ev:hover { transform: translateX(2px); }
  .ev .g { flex: none; font-size: 9px; }
  .ev span.t { overflow: hidden; text-overflow: ellipsis; }
  .ev.due { background: var(--ink); color: var(--on-ink); font-weight: 600; }
  .ev.block { border-color: var(--line); background: var(--panel); }
  .ev.budget { border: 1px dashed var(--faint); color: var(--muted); }
  .more { font-size: 11px; color: var(--muted); padding-left: 6px; }

  /* ---------- Week ---------- */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .wday { border-right: 1px solid var(--line); min-height: 420px; padding: 10px 8px; min-width: 0; animation: cellIn .45s var(--ease) both; animation-delay: calc(var(--i) * 30ms); }
  .wday:last-child { border-right: 0; }
  .wday h3 { margin: 0 0 10px; font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .wday.today h3 .num { background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .wday .ev { white-space: normal; padding: 6px 8px; margin-bottom: 6px; }
  .week-head { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  /* ---------- Rail ---------- */
  .rail { display: grid; gap: 16px; align-content: start; }
  .rail h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .mod { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; transition: background .2s; }
  .mod:hover { background: var(--hover); }
  .ring { width: 44px; height: 44px; }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--ink); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%;
    transition: stroke-dashoffset .9s var(--ease); }
  .mod b { display: flex; align-items: center; gap: 6px; }
  .mod small { color: var(--muted); font-size: 12px; }
  .upc { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); align-items: center; }
  .upc:first-of-type { border-top: 0; }
  .upc .d { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .upc .d b { display: block; font-size: 16px; color: var(--text); }
  .upc button { border: 0; background: none; padding: 0; text-align: left; }
  .upc button:hover .tt { text-decoration: underline; }
  .tt { font-weight: 500; }
  .sub { font-size: 12px; color: var(--muted); }

  /* ---------- Drawer & modal ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: var(--shadow); z-index: 50; transform: translateX(104%); transition: transform .42s var(--ease); display: flex; flex-direction: column; }
  .drawer.on { transform: none; }
  .drawer header { position: static; background: none; backdrop-filter: none; }
  .drawer .body { padding: 18px 24px 32px; overflow: auto; }
  .drawer h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
  .pill { font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .pill.solid { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--ink); transition: width .6s var(--ease); }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); animation: viewIn .4s var(--ease) both; animation-delay: calc(var(--i) * 50ms); }
  .chk { appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--faint); border-radius: 5px; margin: 2px 0 0; display: grid; place-items: center;
    transition: background .2s var(--ease), border-color .2s; }
  .chk::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--on-ink); border-top: 0; border-right: 0;
    transform: rotate(-45deg) scale(0); transition: transform .25s var(--ease); margin-top: -2px; }
  .chk:checked { background: var(--ink); border-color: var(--ink); }
  .chk:checked::after { transform: rotate(-45deg) scale(1); }
  .step.done .st { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .st { transition: color .3s; }
  details.cite summary { font-size: 12px; color: var(--muted); cursor: pointer; list-style: none; margin-top: 4px; }
  details.cite summary::before { content: "↳ "; }
  details.cite[open] blockquote { animation: viewIn .3s var(--ease); }
  blockquote { margin: 6px 0 0; padding: 8px 12px; border-left: 2px solid var(--ink); background: var(--hover); border-radius: 0 8px 8px 0; font-size: 13px; }
  .src { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .modal { position: fixed; left: 50%; top: 50%; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); z-index: 50;
    transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease), transform .3s var(--ease); }
  .modal.on { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  .modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal .mh h2 { margin: 0; font-size: 16px; }
  .modal .mb { padding: 18px 20px 22px; }
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 10px 8px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .2s, border-color .25s; }
  .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--ink); }
  form.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form.grid .full { grid-column: 1 / -1; }
  label.f { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  label.f input, label.f select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; color: var(--text); transition: border-color .2s; min-width: 0; }
  label.f input:focus, label.f select:focus { border-color: var(--ink); outline: none; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
  .row:first-child { border-top: 0; }
  .avatars { display: flex; gap: 8px; flex-wrap: wrap; }
  .avatars button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 18px; transition: transform .2s var(--ease); padding: 0; overflow: hidden; }
  .avatars button:hover { transform: translateY(-2px); }
  .avatars button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .bars .br { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; font-size: 12px; margin-bottom: 8px; }
  .bars .pair { display: grid; gap: 3px; }
  .bars i { display: block; height: 6px; border-radius: 3px; width: 0; transition: width .8s var(--ease); }
  .bars i.est { background: var(--faint); }
  .bars i.act { background: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.ok { background: var(--ink); }
  .status-dot.bad { border: 1.5px solid var(--ink); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .rail { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) {
    header { padding: 10px 16px; gap: 8px; flex-wrap: wrap; }
    .brand span { display: none; }
    .nav-month { margin-left: 0; }
    .nav-month h1 { min-width: 84px; font-size: 14px; margin: 0 4px; }
    .layout { padding: 12px 16px 32px; }
    .rail { grid-template-columns: 1fr; }
    .month { grid-template-columns: 34px repeat(7, minmax(0, 1fr)); }
    .wk { padding: 8px 2px; font-size: 10px; }
    .cell { min-height: 58px; padding: 3px; }
    .cell .ev { font-size: 0; height: 5px; padding: 0; margin-bottom: 2px; border-radius: 3px; }
    .cell .ev .g, .cell .more { display: none; }
    .num { width: 20px; height: 20px; font-size: 11px; }
    .week { grid-template-columns: 1fr; }
    .wday { border-right: 0; border-bottom: 1px solid var(--line); min-height: 0; }
    form.grid { grid-template-columns: 1fr; }
    #addBtn .lbl { display: none; }
    .bars .br { grid-template-columns: 1fr; gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><i class="dot" aria-hidden="true"></i><span>coursework</span></div>
  <div class="nav-month">
    <button class="icon-btn" id="prev" type="button" aria-label="上一个">‹</button>
    <h1 id="title"></h1>
    <button class="icon-btn" id="next" type="button" aria-label="下一个">›</button>
  </div>
  <div class="seg" role="group" id="viewSeg"><span class="thumb"></span>
    <button type="button" data-view="month"></button><button type="button" data-view="week"></button></div>
  <span class="spacer"></span>
  <button class="btn ink" id="addBtn" type="button">＋ <span class="lbl"></span></button>
  <div class="avatar-wrap">
    <button class="avatar" id="avatarBtn" type="button" aria-haspopup="menu" aria-label="账户菜单"></button>
    <span class="badge-dot" title="Ed 登录已过期"></span>
    <div class="menu" role="menu" id="menu">
      <div class="who"><b>MortyYJT</b><span id="whoSub"></span></div>
      <button role="menuitem" data-panel="status"><span>◎</span><span data-i18n="status"></span><span class="hint" data-i18n="edExpiredShort"></span></button>
      <button role="menuitem" data-panel="metrics"><span>▤</span><span data-i18n="metrics"></span></button>
      <button role="menuitem" data-panel="settings"><span>⚙</span><span data-i18n="settings"></span></button>
    </div>
  </div>
</header>

<div class="layout">
  <section class="card" id="cal" aria-live="polite"></section>
  <aside class="rail">
    <div class="card" style="padding:16px"><h2 data-i18n="modules"></h2><div id="mods"></div></div>
    <div class="card" style="padding:16px"><h2 data-i18n="upcoming"></h2><div id="upc"></div></div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true">
  <header><span class="spacer"></span><button class="icon-btn" data-close type="button" aria-label="关闭">✕</button></header>
  <div class="body" id="drawerBody"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"></div>

<script>
// ===================== i18n =====================
const STR = {
  zh: { month: "月", week: "周", add: "新任务", modules: "模块", upcoming: "最近截止", status: "状态", metrics: "度量", settings: "设置",
    edExpiredShort: "Ed 已过期", whoSub: "示例数据 · 上次同步 09:12", teachWeek: "教学周", brk: "假", due: "截止",
    delivery: "交付型", budget: "时间预算型", steps: "步", thisWeek: "本周", close: "关闭", source: "来源", manual: "手动",
    citation: "原文出处", verified: "引文已逐字核对", mins: "分钟", newTask: "新任务", title: "标题", module: "模块", dueDate: "截止日期",
    estimate: "预计分钟", create: "创建", cancel: "取消", theme: "主题", lang: "语言", system: "跟随系统", light: "浅色", dark: "深色",
    avatar: "头像", upload: "上传图片", semStart: "第 1 周开始于", breakWeeks: "假期（在第几周之后）", lastSync: "上次同步",
    syncOk: "已登录", syncBad: "登录已过期，请重新登录", sample: "以上为示例数据。", syncTime: "同步耗时", syncSteps: "同步步数",
    accuracy: "抽取准确率", overrun: "实际比预计多", estVsAct: "预计 vs 实际", est: "预计", act: "实际", syncLog: "同步记录",
    when: "时间", dur: "耗时", cost: "成本", result: "结果", ok: "成功", fail: "失败", addModule: "新建模块", name: "名称",
    mode: "进度算法", weeklyBudget: "每周预算（小时）", more: "更多", teachingWeeks: "教学周设置", manageModules: "模块管理",

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const modOf = (id) => modules.find((m) => m.id === id);

const hhmm = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const mondayOf = (d) => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const taskProgress = (tk) => tk.steps.filter((s) => s.done).length / tk.steps.length;

// Teaching week of a Monday: weeks count from semStart; one break week follows `breakAfter`.
function teachingWeek(monday) {
  const [y, m, d] = settings.semStart.split("-").map(Number);
  const start = mondayOf(new Date(y, m - 1, d));
  const idx = Math.round((monday - start) / (7 * 864e5)); // 0-based weeks since start
  if (idx < 0) return null;
  const b = Number(settings.breakAfter);
  if (b > 0 && idx === b) return { brk: true };
  const n = b > 0 && idx > b ? idx : idx + 1;
  return n > 12 ? null : { n };
}

function eventsOn(date) {
  const out = [];
  tasks.filter((tk) => same(tk.due, date)).forEach((tk) =>
    out.push({ cls: "due", g: modOf(tk.mod).glyph, text: `${t("due")} ${tk.course ? tk.course + " · " : ""}${tk.title}`, task: tk.id }));
  blocks.filter((b) => b.m === date.getMonth() + 1 && b.d === date.getDate() && date.getFullYear() === 2026).forEach((b) =>
    out.push({ cls: modOf(b.mod).mode === "budget" ? "budget" : "block", g: modOf(b.mod).glyph, text: b.t }));
  return out;
}
const evHtml = (e) => `<button type="button" class="ev ${e.cls}" ${e.task ? `data-task="${e.task}"` : 'tabindex="-1"'} title="${esc(e.text)}"><span class="g">${e.g}</span><span class="t">${esc(e.text)}</span></button>`;

let view = "month";

function renderTitle() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  if (view === "month") $("#title").textContent = settings.lang === "en" ? `${MONTHS_EN[m]} ${y}` : `${y} 年 ${m + 1} 月`;
  else {
    const mon = mondayOf(cursor), sun = addDays(mon, 6);
    $("#title").textContent = `${mon.getMonth() + 1}/${mon.getDate()} – ${sun.getMonth() + 1}/${sun.getDate()}`;
  }
}

function renderMonth() {
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  let day = mondayOf(first);
  let html = `<div class="month view"><div class="dow" title="${t("teachWeek")}">${t("wkCol")}</div>${DOW[settings.lang].map((w) => `<div class="dow">${w}</div>`).join("")}`;
  let i = 0;
  for (let r = 0; r < 6; r++) {
    const tw = teachingWeek(day);
    html += `<div class="wk ${tw?.brk ? "break" : ""}" title="${t("teachWeek")}">${tw ? (tw.brk ? `<b>${t("brk")}</b>` : `<b>W${tw.n}</b>`) : "<b>·</b>"}</div>`;
    for (let c = 0; c < 7; c++, day = addDays(day, 1), i++) {
      const evs = eventsOn(day), shown = evs.slice(0, 3);
      html += `<div class="cell ${day.getMonth() !== cursor.getMonth() ? "out" : ""} ${same(day, TODAY) ? "today" : ""}" style="--i:${i}">
        <span class="num">${day.getDate()}</span>${shown.map(evHtml).join("")}${evs.length > 3 ? `<div class="more">+${evs.length - 3} ${t("more")}</div>` : ""}</div>`;
    }
  }
  return html + "</div>";
}

function renderWeek() {
  const mon = mondayOf(cursor), tw = teachingWeek(mon);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  return `<div class="view"><div class="week-head"><span>${t("teachWeek")}：${tw ? (tw.brk ? t("brk") : "W" + tw.n) : "—"}</span></div>
    <div class="week">${days.map((d, i) => `<div class="wday ${same(d, TODAY) ? "today" : ""}" style="--i:${i}">
      <h3><span class="num">${d.getDate()}</span>${DOW[settings.lang][i]}</h3>${eventsOn(d).map(evHtml).join("")}</div>`).join("")}</div></div>`;
}

const R = 18, C = 2 * Math.PI * R;
function ring(p) {
  return `<svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="${R}"/>
    <circle class="fg" cx="22" cy="22" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-target="${C * (1 - Math.min(p, 1))}"/></svg>`;
}

function renderRail() {
  $("#mods").innerHTML = modules.map((m) => {
    if (m.mode === "budget") {
      return `<div class="mod">${ring(m.usedH / m.budgetH)}<div><b>${m.glyph} ${esc(modName(m))}</b>
        <small>${t("budget")} · ${t("thisWeek")} ${m.usedH} / ${m.budgetH} ${t("hours")}</small></div></div>`;
    }
    const all = tasks.filter((tk) => tk.mod === m.id).flatMap((tk) => tk.steps), done = all.filter((s) => s.done).length;
    const p = all.length ? done / all.length : 0;
    return `<div class="mod">${ring(p)}<div><b>${m.glyph} ${esc(modName(m))}</b>
      <small>${t("delivery")} · ${done}/${all.length} ${t("steps")} · ${Math.round(100 * p)}%</small></div></div>`;
  }).join("");
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".ring .fg").forEach((el) => (el.style.strokeDashoffset = el.dataset.target))));
  const next = tasks.filter((tk) => tk.due >= TODAY).sort((a, b) => a.due - b.due).slice(0, 5);
  $("#upc").innerHTML = next.map((tk) => `<div class="upc"><div class="d"><b>${tk.due.getDate()}</b>${settings.lang === "en" ? MONTHS_EN[tk.due.getMonth()].slice(0, 3) : tk.due.getMonth() + 1 + "月"}</div>
    <button type="button" data-task="${tk.id}"><div class="tt">${modOf(tk.mod).glyph} ${esc(tk.title)}</div>
    <div class="sub">${tk.course ? esc(tk.course) + " · " : ""}${hhmm(tk.due)} · ${Math.round(100 * taskProgress(tk))}%</div></button></div>`).join("");
}

function showLayer(sel, focusSel) {
  lastFocus = document.activeElement;
  $("#scrim").classList.add("on");

  requestAnimationFrame(() => placeSegThumbs(el));
  setTimeout(() => $(focusSel || `${sel} [data-close]`)?.focus(), 60);
}
function closeLayers() {
  $("#scrim").classList.remove("on");
  ["#drawer", "#modal"].forEach((s) => { $(s).classList.remove("on"); $(s).setAttribute("aria-hidden", "true"); });
  lastFocus?.focus?.();
}

// ===================== Apply settings =====================
function applyTheme() {
  if (settings.theme === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = settings.theme;
}
function applyAvatar() {
  const a = settings.avatar;
  $("#avatarBtn").innerHTML = a.startsWith("data:") ? `<img src="${a}" alt="">` : esc(a);
}
function applyLang() {
  document.documentElement.lang = settings.lang === "en" ? "en" : "zh-CN";
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  $('#viewSeg [data-view="month"]').textContent = t("month");
  $('#viewSeg [data-view="week"]').textContent = t("week");
  $("#addBtn .lbl").textContent = t("add");
  $("#whoSub").textContent = t("whoSub");
}
function renderAll() { applyLang(); renderCal(); renderRail(); }

// ===================== Events =====================
document.addEventListener("click", (e) => {
  const el = e.target;
  const v = el.closest("[data-view]"); if (v) { view = v.dataset.view; renderCal(); return; }
  const tk = el.closest("[data-task]"); if (tk) { openDrawer(tk.dataset.task); return; }
  if (el.closest("[data-close]") || el.id === "scrim") { closeLayers(); return; }
  const p = el.closest("[data-panel]"); if (p) { $("#menu").classList.remove("open"); openPanel(p.dataset.panel); return; }
  const tab = el.closest("[data-tab]"); if (tab) {
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b === tab)));
    $("#modal h2").textContent = t(tab.dataset.tab);
    $("#panelBody").innerHTML = panelBody(tab.dataset.tab);
    $("#panelBody").animate?.([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 240, easing: "ease-out" });
    placeSegThumbs($("#panelBody")); if (tab.dataset.tab === "metrics") animateBars(); return;
  }
  const th = el.closest("[data-theme-opt]"); if (th) { settings.theme = th.dataset.themeOpt; store.set("theme", settings.theme); applyTheme();
    th.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === th))); placeSegThumbs(th.closest(".row")); return; }
  const lg = el.closest("[data-lang]"); if (lg) { settings.lang = lg.dataset.lang; store.set("lang", settings.lang); renderAll(); openPanel("settings"); return; }
  const av = el.closest("[data-av]"); if (av) { settings.avatar = av.dataset.av; store.set("avatar", settings.avatar); applyAvatar();
    document.querySelectorAll("[data-av]").forEach((b) => b.setAttribute("aria-pressed", String(b === av))); return; }
  if (el.closest("#upBtn")) { $("#upFile").click(); return; }
  if (el.closest("#avatarBtn")) { $("#menu").classList.toggle("open"); return; } // click/touch fallback for hover
  if (!el.closest(".avatar-wrap")) $("#menu").classList.remove("open");
  if (el.closest("#addBtn")) { openAdd(); return; }
  if (el.closest("#prev") || el.closest("#next")) {
    const dir = el.closest("#prev") ? -1 : 1;
    cursor = view === "month" ? new Date(cursor.getFullYear(), cursor.getMonth() + dir, 1) : addDays(cursor, 7 * dir);
    renderCal();
  }
});

document.addEventListener("change", (e) => {
  const c = e.target.closest(".chk");
  if (c) {
    const tk = tasks.find((x) => x.id === c.dataset.t); tk.steps[+c.dataset.s].done = c.checked;
    c.closest(".step").classList.toggle("done", c.checked);
    $("#drawer .bar i").style.width = taskProgress(tk) * 100 + "%";
    renderRail(); return;
  }
  if (e.target.id === "upFile" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => { settings.avatar = r.result; store.set("avatar", r.result); applyAvatar(); };
    r.readAsDataURL(e.target.files[0]); return;
  }
  if (e.target.closest("#weekForm")) {
    const f = new FormData($("#weekForm"));
    settings.semStart = f.get("semStart"); settings.breakAfter = Number(f.get("breakAfter"));
    store.set("semStart", settings.semStart); store.set("breakAfter", settings.breakAfter); renderCal();
  }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === "addForm") {
    const [y, m, d] = f.get("due").split("-").map(Number);
    tasks.push({ id: "t" + Date.now(), mod: f.get("mod"), title: f.get("title"), due: new Date(y, m - 1, d, 23, 59), src: "manual",
      steps: [{ t: f.get("title"), est: Number(f.get("est")) || 60, done: false }] });
    closeLayers(); renderCal(); renderRail();
  }
  if (e.target.id === "modForm") {
    modules.push({ id: "m" + Date.now(), name: f.get("name"), glyph: "■", mode: f.get("mode"), budgetH: Number(f.get("budget")) || 4, usedH: 0 });
    renderRail(); openPanel("settings");
  }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeLayers(); $("#menu").classList.remove("open"); } });
window.addEventListener("resize", () => placeSegThumbs());

applyTheme(); applyAvatar(); renderAll();
</script>
</body>
</html>
